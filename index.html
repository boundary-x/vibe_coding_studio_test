    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useRef } = React;

        // =========================================================================

        const PONYBOT_EXTENSION = `
declare enum DigitalPin { P0, P1, P2, P3, P4, P5, P6, P7, P8, P9, P10, P11, P12, P13, P14, P15, P16 }

    function checkSingleLineSensor(channel: LineSensorChannel, state: LineState): boolean;

    enum SensorVersion { V1 = 1, V2 = 2 }
    enum DetectedColor { Red, Green, Blue, Yellow }
    function initColorSensor(version: SensorVersion): void;
    function getLight(): number;
    function getRed(): number;
    function getGreen(): number;
    function getBlue(): number;
    function isColorAdvanced(color: DetectedColor, threshold?: number): boolean;
    function isColorInRange(minR: number, maxR: number, minG: number, maxG: number, minB: number, maxB: number): boolean;
    
    enum UARTDataType { X, Y, W, H, D }
    enum ColorDataType { R, G, B, I }
    enum ReturnFormat { String, Number }
    function parseUARTUnified(data: string, type: UARTDataType, format: ReturnFormat): any;
    function parseColorUnified(data: string, color: ColorDataType, format: ReturnFormat): any;
    
    enum FaceDataType { X, Y, Z, Yaw, Pitch, Mouth, LeftEye, RightEye, Roll, Smile, Visible }
    enum HandDataType { LeftDir, LeftSpeed, RightDir, RightSpeed }
    function parseFaceUnified(data: string, type: FaceDataType): number;
    function parseHandPoseUnified(data: string, type: HandDataType, format: ReturnFormat): any;
    
    enum Display { On = 1, Off = 0 }
    function invert(on?: boolean): void;
    function clear(): void;
    function display(on: boolean): void;
    function pixel(x: number, y: number, color?: number): void;
    function showString(text: string, column: number, row: number, color?: number): void;
    function showNumber(number: number, column: number, row: number, color?: number): void;
    function printString(text: string, newline?: boolean): void;
    function printNumber(number: number, newline?: boolean): void;
    function horizontalLine(x: number, y: number, length: number, color?: number): void;
    function verticalLine(x: number, y: number, length: number, color?: number): void;
    function rectangle(x1: number, y1: number, x2: number, y2: number, color?: number): void;
}

declare namespace neopixel {
    enum NeoPixelColors { Red = 0xFF0000, Orange = 0xFFA500, Yellow = 0xFFFF00, Green = 0x00FF00, Blue = 0x0000FF, Indigo = 0x000080, Violet = 0x8a2be2, White = 0xFFFFFF, Black = 0x000000 }
    enum NeoPixelMode { RGB = 1, RGBW = 2, RGB_RGB = 3 }
    enum HueInterpolationDirection { Clockwise, CounterClockwise, Shortest }
    class Strip {
        showColor(rgb: number): void;
        showRainbow(startHue?: number, endHue?: number): void;
        showBarGraph(value: number, high: number): void;
        setPixelColor(pixelOffset: number, rgb: number): void;
        show(): void;
        clear(): void;
        getLength(): number;
        setBrightness(brightness: number): void;
        createRange(start: number, length: number): Strip;
        setPin(pin: DigitalPin): void;
    }
    function create(pin: DigitalPin, numLeds: number, mode: NeoPixelMode): Strip;
    function rgb(red: number, green: number, blue: number): number;
    function pickColorPackRGB(color: number): number;
    function getColors(color: NeoPixelColors): number;

`;

        // =========================================================================
        // 2. 바이브램프 확장블록 정의
        // =========================================================================
        const VIBELAMP_EXTENSION = `
declare enum DigitalPin { P0, P1, P2, P3, P4, P5, P6, P7, P8, P9, P10, P11, P12, P13, P14, P15, P16 }
enum NeoPixelColors {
    Red = 0xFF0000,
    Orange = 0xFFA500,
    Yellow = 0xFFFF00,
    Green = 0x00FF00,
    Blue = 0x0000FF,
    Indigo = 0x000080,
    Violet = 0x8a2be2,
    White = 0xFFFFFF,
    Black = 0x000000
}

enum NeoPixelMode {
    RGB = 1,
    RGBW = 2,
    RGB_RGB = 3
}

namespace vibeLamp {
    function sendBuffer(buf: Buffer, pin: DigitalPin): void;

    export class Strip {
        buffer: Buffer;
        pin: DigitalPin;
        brightness: number;
        start: number;
        _length: number;
        mode: NeoPixelMode;
        matrixWidth: number;
        matrixChain: number;
        matrixRotation: number;
        _isShowing: boolean;

        showColor(rgb: number): void;
        clear(): void;
        setBrightness(brightness: number): void;
        createRange(start: number, length: number): Strip;
        show(): void;
        setPixelColor(pixelOffset: number, rgb: number): void;
        showRainbow(startHue?: number, endHue?: number): void;
        showBarGraph(value: number, high: number): void;
        shift(offset?: number): void;
        rotate(offset?: number): void;
        getLength(): number;
        setMatrixWidth(width: number, rotation: number, chain: number): void;
        setMatrixColor(x: number, y: number, rgb: number): void;
        setPin(pin: DigitalPin): void;
    }

    export function create(pin: DigitalPin, numLeds: number, mode: NeoPixelMode): Strip;
    export function rgb(red: number, green: number, blue: number): number;
    export function pickColor(color: number): number;
    export function colors(color: NeoPixelColors): number;
    export function hsl(hue: number, saturation: number, luminance: number): number;

    export enum UARTDataType { X, Y, W, H, D }
    export enum ColorDataType { R, G, B, I }
    export enum ReturnFormat { String, Number }
    export enum FaceDataType { X, Y, Z, Yaw, Pitch, Mouth, LeftEye, RightEye, Roll, Smile, Visible }
    export enum HandDataType { LeftDir, LeftSpeed, RightDir, RightSpeed }

    export function parseUARTUnified(data: string, type: UARTDataType, format: ReturnFormat): any;
    export function parseColorUnified(data: string, color: ColorDataType, format: ReturnFormat): any;
    export function parseFaceUnified(data: string, type: FaceDataType): number;
    export function parseHandPoseUnified(data: string, type: HandDataType, format: ReturnFormat): any;

    export enum Display { On = 1, Off = 0 }
    
    export function invert(on?: boolean): void;
    export function clear(): void;
    export function display(on: boolean): void;
    export function pixel(x: number, y: number, color?: number): void;
    export function showString(text: string, column: number, row: number, color?: number): void;
    export function showNumber(number: number, column: number, row: number, color?: number): void;
    export function printString(text: string, newline?: boolean): void;
    export function printNumber(number: number, newline?: boolean): void;
    export function horizontalLine(x: number, y: number, length: number, color?: number): void;
    export function verticalLine(x: number, y: number, length: number, color?: number): void;
    export function rectangle(x1: number, y1: number, x2: number, y2: number, color?: number): void;
}
`;

        // =========================================================================
        // 🚀 [필수 설정] 백엔드(Cloud Functions) 접속 URL
        // 구글 클라우드에서 배포 완료 후 받은 긴 URL을 아래 따옴표 안에 붙여넣으세요.
        // =========================================================================

        // MakeCode official renderer: code only; credentials are never sent to this frame.
        const BlockPreview = ({ code, product }) => {
            const [result, setResult] = useState({ status: 'loading' });
            const [attempt, setAttempt] = useState(0);
            const [fullSize, setFullSize] = useState(false);
            useEffect(() => {
                setResult({ status: 'loading' });
                setFullSize(false);
                // The renderer may silently choose defaults for malformed syntax.
                // Babel is already loaded by this app; parse TypeScript before rendering.
                try {
                    Babel.transform(code, { filename: 'main.ts', presets: ['typescript'], ast: false, code: false });
                } catch (error) {
                    const line = error.loc && error.loc.line;
                    setResult({ status: 'error', message: (line ? line + '번째 줄에 ' : '') + '코드 문법 오류가 있어 블록 이미지를 만들지 않았어요. 코드를 수정한 뒤 ‘코드 설명’을 다시 눌러주세요.' });
                    return;
                }
                const origin = 'https://makecode.microbit.org';
                const frame = document.createElement('iframe');
                const id = 'blocks-' + crypto.randomUUID();
                let finished = false;
                let sent = false;
                let timer;
                const cleanup = () => {
                    clearTimeout(timer);
                    window.removeEventListener('message', receive);
                    frame.remove();
                };
                const finish = (value) => {
                    if (finished) return;
                    finished = true;
                    cleanup();
                    setResult(value);
                };
                const receive = (event) => {
                    if (event.origin !== origin || event.source !== frame.contentWindow) return;
                    const msg = event.data;
                    if (!msg || msg.source !== 'makecode') return;
                    if (msg.type === 'renderready' && !sent) {
                        sent = true;
                        const packages = product === 'ponybot'
                            ? ['ai-ponybot-basic=github:boundary-x/ai_ponybot_basic#v1.3.1',
                               'ai-ponybot-light=github:boundary-x/ai_ponybot_light#v1.1.1']
                            : ['vibelamp=github:boundary-x/vibelamp#v1.4.0'];
                        // Bluetooth and radio are mutually exclusive on micro:bit.
                        packages.push(/\bbluetooth\s*\./.test(code) ? 'bluetooth' : 'radio');
                        if (/\bservos\s*\./.test(code)) packages.push('servo');
                        frame.contentWindow.postMessage({
                            type: 'renderblocks', id, code,
                            options: { package: packages.join(','), snippetMode: false }
                        }, origin);
                    }
                    if (msg.type === 'renderblocks' && msg.id === id) {
                        if (msg.error || !/^data:image\/(?:png|svg\+xml)[;,]/.test(msg.uri || '')) {
                            finish({ status: 'error', message: '블록 이미지를 만들지 못했어요. 코드 오류나 지원되지 않는 블록이 있는지 제품별 MakeCode에서 확인해주세요.' });
                        } else {
                            finish({ status: 'ready', uri: msg.uri, width: msg.width });
                        }
                    }
                };
                frame.title = 'MakeCode 블록 이미지 변환기';
                frame.setAttribute('aria-hidden', 'true');
                frame.tabIndex = -1;
                frame.style.cssText = 'position:fixed;left:-10000px;top:0;width:1px;height:1px;border:0';
                window.addEventListener('message', receive);
                timer = setTimeout(() => finish({ status: 'error', message: '블록 이미지 변환 시간이 초과됐어요. 인터넷 연결을 확인하고 다시 시도해주세요.' }), 60000);
                frame.src = origin + '/--docs?render=1&lang=ko';
                document.body.appendChild(frame);
                return () => { finished = true; cleanup(); };
            }, [code, product, attempt]);
            return (
                <section className="mb-5 rounded-xl border border-gray-200 bg-gray-50 p-4" aria-label="블록 이미지">
                    <div className="flex items-center justify-between gap-2 mb-2">
                        <h3 className="font-bold">블록으로 보기</h3>
                        {result.status === 'ready' && <button className="text-xs underline" onClick={() => setFullSize(!fullSize)}>{fullSize ? '화면에 맞추기' : '원본 크기로 보기'}</button>}
                    </div>
                    {result.status === 'loading' && <p role="status">MakeCode에서 블록 이미지를 만들고 있어요…</p>}
                    {result.status === 'error' && <div role="status"><p>{result.message}</p><button className="underline mt-2" onClick={() => setAttempt(attempt + 1)}>블록 이미지 다시 만들기</button></div>}
                    {result.status === 'ready' && <div className="overflow-auto bg-white rounded-lg p-2" style={{maxHeight:'55vh'}}><img src={result.uri} alt="현재 설명 중인 코드의 MakeCode 블록 이미지" style={{width:fullSize ? result.width : '100%', maxWidth:fullSize ? 'none' : result.width, height:'auto'}} /></div>}
                    <p className="text-xs text-gray-500 mt-2">설명 요청 시점의 미리보기이며 실행 검증 결과는 아니에요. 회색 블록은 JavaScript가 그대로 표시된 부분입니다.</p>
                </section>
            );
        };


        // Render a small, safe Markdown subset as React nodes (never raw HTML).
        const ExplanationText = ({ text }) => {
            const inline = value => value.split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g).map((part, i) =>
                part.startsWith('**') && part.endsWith('**') ? <strong key={i}>{part.slice(2,-2)}</strong> :
                part.startsWith('`') && part.endsWith('`') ? <code key={i}>{part.slice(1,-1)}</code> :
                part.startsWith('*') && part.endsWith('*') ? <em key={i}>{part.slice(1,-1)}</em> : part);
            const blocks = [];
            let items = [], kind = '';
            const flush = () => {
                if (!items.length) return;
                const Tag = kind === 'ol' ? 'ol' : 'ul';
                blocks.push(<Tag key={blocks.length} className={kind === 'ol' ? 'list-decimal pl-5 space-y-2 mb-3' : 'list-disc pl-5 space-y-2 mb-3'}>{items.map((item,i)=><li key={i}>{inline(item)}</li>)}</Tag>);
                items = [];
            };
            for (const line of text.split(/\r?\n/)) {
                const value = line.trim();
                const match = value.match(/^(\d+[.)]|[-*])\s+(.+)$/);
                if (match) {
                    const next = /^\d/.test(match[1]) ? 'ol' : 'ul';
                    if (kind !== next) flush();
                    kind = next; items.push(match[2]); continue;
                }
                flush();
                if (!value || /^[-*_]{3,}$/.test(value)) continue;
                const heading = value.match(/^#{1,6}\s+(.+)$/);
                blocks.push(heading ? <h4 key={blocks.length} className="font-bold mb-2">{inline(heading[1])}</h4> : <p key={blocks.length} className="mb-3">{inline(value)}</p>);
            }
            flush();
            return <div className="explanation-text">{blocks}</div>;
        };

        const App = () => {
            // 접속키 상태 관리로 변경 (apiKey -> accessKey)


            
            // 제품 상태 (ponybot / vibelamp)
            const [product, setProduct] = useState('ponybot');
            
            // 프롬프트 모드 상태 (new / improve / fix)
            const [promptMode, setPromptMode] = useState('new');

            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [generatedCode, setGeneratedCode] = useState('// 여기에 AI가 생성한 코드가 나타납니다.');
            const [isLoading, setIsLoading] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);
            
            const [showExplanation, setShowExplanation] = useState(false);
            const [explanationText, setExplanationText] = useState('');
            const [explanationSnapshot, setExplanationSnapshot] = useState(null);
            const [isExplaining, setIsExplaining] = useState(false);

            const messagesEndRef = useRef(null);

            // 초기 인사말 설정 (제품 전환 시 변경)
            useEffect(() => {
                const productName = product === 'ponybot' ? 'AI 포니봇' : '바이브램프';

    </script>
<script>
(() => {
  const history = [];
const defaults = {
  gemini: { model: 'gemini-3.8-flash', input: .75, output: 3.75 },
  claude: { model: 'claude-haiku-5-5', input: .10, output: .50 }
};
function config(env = {}) {
  return Object.fromEntries(Object.entries(defaults).map(([provider, d]) => {
    const prefix = provider.toUpperCase();
    const model = env[`${prefix}_MODEL`] || d.model;
    const number = (name, fallback) => env[name] !== undefined && env[name] !== '' ? Number(env[name]) : fallback;
    // Unknown models must not inherit another model's prices.
    const known = model === d.model;
    const promotionActive = new Date() < new Date('2027-01-01T00:00:00Z');
    return [provider, {
      model,
      key: env[provider === 'gemini' ? 'GEMINI_API_KEY' : 'ANTHROPIC_API_KEY'],
      inputRate: number(`${prefix}_INPUT_RATE`, known ? (provider === 'gemini' && !promotionActive ? 1.5 : d.input) : null),
      outputRate: number(`${prefix}_OUTPUT_RATE`, known ? (provider === 'gemini' && !promotionActive ? 7.5 : d.output) : null)
    }];
  }));
}
function normalize(provider, data) {
  if (provider === 'gemini') {
    const candidate = data.candidates?.[0];
    const u = data.usageMetadata;
    return {
      text: (candidate?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join(''),
      stopReason: candidate?.finishReason || data.promptFeedback?.blockReason || 'unknown',
      complete: candidate?.finishReason === 'STOP',
      inputTokens: u?.promptTokenCount ?? null,
      outputTokens: u?.candidatesTokenCount == null ? null : u.candidatesTokenCount + (u.thoughtsTokenCount || 0),
      thinkingTokens: u?.thoughtsTokenCount ?? null,
      rawUsage: u || null
    };
  }
  return {
    text: (data.content || []).filter(p => p.type === 'text').map(p => p.text).join('\n'),
    stopReason: data.stop_reason || 'unknown', complete: data.stop_reason === 'end_turn',
    inputTokens: data.usage ? (data.usage.input_tokens || 0) + (data.usage.cache_read_input_tokens || 0) + (data.usage.cache_creation_input_tokens || 0) : null,
    outputTokens: data.usage?.output_tokens ?? null, thinkingTokens: null,
    rawUsage: data.usage || null
  };
}
function estimate(provider, result, settings) {
  let { inputRate, outputRate } = settings;
  if (provider === 'claude' && settings.model === defaults.claude.model && result.inputTokens > 100000) {
    inputRate = .50; outputRate = 2.50;
  }
  if (![inputRate, outputRate, result.inputTokens, result.outputTokens].every(x => typeof x === 'number' && Number.isFinite(x) && x >= 0)) return null;
  return (result.inputTokens * inputRate + result.outputTokens * outputRate) / 1e6;
}
async function runProvider(provider, settings, input, fetcher = fetch) {
  const start = performance.now();
  const base = { provider, model: settings.model, attempts: 1 };
  if (!settings.key) return { ...base, ok: false, error: `${provider === 'claude' ? 'ANTHROPIC_API_KEY' : 'GEMINI_API_KEY'} 환경 변수가 설정되지 않았습니다.`, elapsedMs: 0 };
  const gemini = provider === 'gemini';
  const url = gemini
    ? `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model)}:generateContent`
    : 'https://api.anthropic.com/v1/messages';
  const body = gemini ? {
    contents: [{ role: 'user', parts: [{ text: input.prompt }] }],
    systemInstruction: { parts: [{ text: input.systemInstruction }] },
    generationConfig: { maxOutputTokens: 8192 }
  } : {
    model: settings.model, max_tokens: 8192, system: input.systemInstruction,
    messages: [{ role: 'user', content: input.prompt }]
  };
  try {
    const response = await fetcher(url, {
      method: 'POST', signal: AbortSignal.timeout(120000),
      headers: gemini ? { 'content-type': 'application/json', 'x-goog-api-key': settings.key }
        : { 'content-type': 'application/json', 'x-api-key': settings.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify(body)
    });
    // Do not relay provider error bodies: these may contain request or credential details.
    if (!response.ok) return { ...base, ok: false, status: response.status, error: `API HTTP ${response.status} — 키·모델 접근 권한·할당량을 확인하세요.`, elapsedMs: Math.round(performance.now() - start) };
    const result = normalize(provider, await response.json());
    return { ...base, ...result, ok: !!result.text.trim(), error: result.text.trim() ? undefined : '텍스트 결과가 없습니다.', estimatedUsd: estimate(provider, result, settings), elapsedMs: Math.round(performance.now() - start) };
  } catch (error) {
    return { ...base, ok: false, error: error.name === 'TimeoutError' ? '120초 응답 제한을 초과했습니다. 서버에서 과금이 발생했을 수 있습니다.' : 'API 연결 또는 응답 처리에 실패했습니다.', elapsedMs: Math.round(performance.now() - start) };
  }
}


  let apiKeys = {gemini:'', claude:''};
  const modelSettings = config({});
  function keyDialog() {
    if (active) return;
    const d = dialog('테스트 API 키 입력');
    d.append(el('p', '각 업체의 실제 API 키를 입력하세요. 키는 현재 탭 메모리에서만 사용하며 새로고침하면 지워집니다. 각 API 업체로 직접 요청합니다.'));
    for (const [p, title] of [['gemini','Gemini API 키'], ['claude','Claude API 키']]) {
      const label=el('label',title); const input=el('input'); input.type='password'; input.autocomplete='off'; input.placeholder=title; input.value=apiKeys[p]; input.oninput=()=>{apiKeys[p]=input.value.trim();}; label.append(input); d.append(label);
    }
    d.append(button('키 지우기',()=>{apiKeys={gemini:'',claude:''}; d.close();}),button('입력 완료',()=>d.close()));
  }
  let active = false;
  let modal;
  const el = (tag, text, cls) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  };
  const button = (text, action) => {
    const b = el('button', text); b.type = 'button'; b.onclick = action; return b;
  };
  const ready = Promise.resolve();
  const bar = el('div', undefined, 'lab-bar');
  bar.append(el('strong', 'TEST · 블록 설명 v3'), el('span', '코드 생성: 두 모델 비교 · 블록 이미지: API 키 없이 확인'));
  bar.append(button('API 키 입력', keyDialog), button('비교 기록', showHistory), button('결과 내려받기', download));
  document.body.append(bar);
  function download() {
    const blob = new Blob([JSON.stringify({ schemaVersion: 1, source: 'boundary-x/vibe_coding_studio/index.html', sourceBlob: '92fbab429e3cdd8e83c41b157f9842f6104f3230', exportedAt: new Date().toISOString(), records: history }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a'); a.href = url; a.download = `vibe-comparison-${Date.now()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function dialog(title) {
    modal?.remove();
    const d = el('dialog', undefined, 'lab-dialog');
    d.append(el('h2', title)); document.body.append(d); d.showModal(); modal = d; return d;
  }
  function showHistory() {
    if (active) return;
    const d = dialog('비교 기록');
    d.append(el('p', '최근 40건을 이 페이지에서만 보관합니다. 새로고침 전에 내려받으세요. 내보내기에는 질문·코드·시스템 규칙이 포함됩니다.'));
    for (const record of history) {
      d.append(button(`${record.at} · ${record.context.product} · ${record.context.mode}`, () => display(record)));
    }
    d.append(button('닫기', () => d.close()));
  }
  function display(record, resolve, reject) {
    const d = dialog('Gemini · Claude 생성 결과 비교');
    d.append(el('p', '동일한 입력 · 모델별 1회 호출 · 자동 재시도 없음. 결과 선택 후 원래 에디터에 반영됩니다.'));
    d.append(el('p', '블록 변환과 로봇 동작은 자동 검증하지 않습니다. 각 결과를 제품별 MakeCode 환경에 복사해 확인한 뒤 평가하세요.'));
    const grid = el('div', undefined, 'lab-grid'); d.append(grid);
    for (const r of record.results) {
      const card = el('section', undefined, 'lab-card'); grid.append(card);
      card.append(el('h3', r.model));
      const cost = r.estimatedUsd == null ? '산출 불가' : `${r.estimatedUsd.toFixed(6)}`;
      card.append(el('p', `${(r.elapsedMs / 1000).toFixed(2)}초 · 입력 ${r.inputTokens ?? '미제공'} / 과금 출력 ${r.outputTokens ?? '미제공'} 토큰 · 추정 ${cost}`));
      card.append(el('small', '캐시 할인 전 단가 추정액 · 과금 출력에는 추론 사용량 포함 · 실패 호출 비용은 미확인'));
      if (!r.ok) card.append(el('p', r.error, 'lab-error'));
      if (r.ok && !r.complete) card.append(el('p', `종료 상태: ${r.stopReason}. 잘리거나 거절된 결과일 수 있어 적용할 수 없습니다.`, 'lab-error'));
      card.append(el('pre', r.text || '(생성 결과 없음)'));
      if (r.text) card.append(button('응답 복사', async () => {
        try { await navigator.clipboard.writeText(r.text); } catch { alert('복사 권한이 없습니다. 결과 텍스트를 직접 선택해 복사하세요.'); }
      }));
      r.review ||= {};
      for (const [key, label] of [['blocks', '블록 변환'], ['intent', '원하는 동작'], ['preservation', '기존 코드 보존']]) {
        const row = el('label', label + ' '); const select = el('select');
        for (const v of ['미평가', '성공', '실패', '해당 없음']) { const o = el('option', v); o.value = v; select.append(o); }
        select.value = r.review[key] || '미평가'; select.onchange = () => { r.review[key] = select.value; }; row.append(select); card.append(row);
      }
      const notes = el('textarea'); notes.placeholder = '오류 원인·실제 동작·관찰 내용'; notes.value = r.review.notes || ''; notes.oninput = () => { r.review.notes = notes.value; }; card.append(notes);
      if (resolve && r.ok && r.complete) card.append(button('이 결과를 에디터에 적용', () => { record.selected = r.provider; d.close(); resolve(r.text); }));
    }
    const close = () => { d.close(); if (reject) reject(Error('비교 결과를 적용하지 않았습니다. 기존 코드를 유지합니다.')); };
    d.addEventListener('cancel', event => { event.preventDefault(); close(); });
    d.append(button(resolve ? '적용하지 않고 닫기' : '닫기', close), button('결과 내려받기', download));
  }
  window.ComparisonLab = {
    openKeys: keyDialog,
    async explain(prompt, systemInstruction) {
      await ready;
      const provider = apiKeys.gemini ? 'gemini' : apiKeys.claude ? 'claude' : null;
      if (!provider) return '블록 이미지는 API 키 없이 볼 수 있어요. 동작 설명도 보려면 상단 ‘API 키 입력’에서 Gemini 또는 Claude 키를 입력한 뒤 ‘코드 설명’을 다시 눌러주세요.';
      const result = await runProvider(provider, { ...modelSettings[provider], key: apiKeys[provider] }, { prompt, systemInstruction });
      if (!result.ok || !result.complete) throw Error(result.error || '설명이 끝까지 생성되지 않았습니다. 다시 시도해주세요.');
      return result.text;
    },
    async generate(prompt, systemInstruction, context) {
      await ready;
      if (active) throw Error('비교가 이미 진행 중입니다.');
      if (!apiKeys.gemini || !apiKeys.claude) { keyDialog(); throw Error('두 API 키를 입력한 뒤 다시 요청해주세요.'); }
      active = true;
      try {
        const snapshot = { ...apiKeys };
        const settingsSnapshot = Object.fromEntries(Object.entries(modelSettings).map(([p,s])=>[p,{...s,key:snapshot[p]}]));
        const results = await Promise.all(Object.entries(settingsSnapshot).map(([p,s])=>runProvider(p,s,{prompt,systemInstruction})));
        const record = {id:crypto.randomUUID(),at:new Date().toISOString(),settings:{maxOutputTokens:8192,retries:0,reasoning:'provider default',temperature:'provider default'},results};
        record.prompt = prompt; record.systemInstruction = systemInstruction; record.context = { ...context };
        history.unshift(record); if (history.length > 40) history.pop();
        return await new Promise((resolve, reject) => display(record, resolve, reject));
      } finally { active = false; }
    }
  };
})();
